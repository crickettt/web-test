<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audio dan Gambar</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="content">
    <!-- Gambar JPEG -->
    <img src="gambar.jpeg" alt="Gambar" class="image">
    
    <!-- Pemutar Audio MP3 tanpa tombol Play -->
    <audio id="audio">
      <source src="audio.mp3" type="audio/mpeg">
      Browser Anda tidak mendukung pemutar audio.
    </audio>
  </div>
  
  <script src="script.js"></script>
</body>
</html>
